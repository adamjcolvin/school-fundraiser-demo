en:
  activerecord:
    attributes:
      donation:
        donor_name: Name
        donor_email: Email
        amount: Amount
        amount_cents: Amount
        note: Note
    errors:
      models:
        donation:
          attributes:
            donor_email:
              invalid: must be a real email address
            amount_cents:
              not_a_number: must be a dollar amount, like 25 or 25.00
