# Free web service and free Postgres for the Oak Street fundraiser.
# Create the service from this Blueprint so Render uses the Ruby runtime.
# Set RAILS_MASTER_KEY in the Dashboard before the first deploy. The value
# is the contents of config/master.key on a machine that has the repo.
# That file is gitignored.

databases:
  - name: school-fundraiser-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: school-fundraiser
    runtime: ruby
    plan: free
    region: oregon
    branch: main
    buildCommand: ./bin/render-build.sh
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    autoDeployTrigger: commit
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_LEVEL
        value: info
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: school-fundraiser-db
          property: connectionString
      - key: WEB_CONCURRENCY
        value: "0"
